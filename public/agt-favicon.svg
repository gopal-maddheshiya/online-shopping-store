<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="agtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145A45"/>
      <stop offset="100%" stop-color="#093125"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#E3B341"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="128" height="128" rx="28" fill="url(#agtGrad)"/>
  
  <!-- Outer Subtle Border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#E3B341" stroke-width="3" stroke-opacity="0.6"/>
  
  <!-- Grocery Basket / Shopping Bag Graphic -->
  <path d="M44 48 C44 34, 84 34, 84 48" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M30 48 L98 48 L90 98 C90 102, 86 106, 82 106 L46 106 C42 106, 38 102, 38 98 Z" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Brand Initials "AGT" in Center -->
  <text x="64" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">AGT</text>
  
  <!-- Wheat Sprout Accent -->
  <circle cx="64" cy="48" r="4" fill="#E3B341"/>
</svg>
