<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" fill="none">
  <defs>
    <linearGradient id="green" x1="70" y1="90" x2="470" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B6B50"/>
      <stop offset="1" stop-color="#0B4735"/>
    </linearGradient>
    <linearGradient id="gold" x1="100" y1="80" x2="430" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2C14E"/>
      <stop offset="1" stop-color="#C98512"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B4735" flood-opacity=".13"/>
    </filter>
  </defs>

  <!-- Brand mark -->
  <g transform="translate(30,35)" filter="url(#soft)">
    <!-- outer badge -->
    <circle cx="165" cy="165" r="145" fill="#F8F4EA" stroke="#D9C79A" stroke-width="4"/>
    <circle cx="165" cy="165" r="127" stroke="#145A45" stroke-opacity=".18" stroke-width="2"/>

    <!-- stylized AG monogram -->
    <path d="M92 255L151 78L210 255H184L171 216H130L117 255H92ZM137 191H165L151 145L137 191Z" fill="url(#green)"/>
    <path d="M197 116C224 90 271 94 291 120C307 141 307 171 292 191C278 210 252 220 229 216V191C248 194 266 184 272 168C280 146 264 126 244 126C230 126 219 133 212 143L197 116Z" fill="url(#gold)"/>
    <path d="M229 218H294V242H225C210 242 197 231 197 216C197 204 205 193 218 190L229 218Z" fill="#145A45"/>

    <!-- wheat + leaf -->
    <path d="M83 137C67 111 66 85 78 66" stroke="#145A45" stroke-width="7" stroke-linecap="round"/>
    <path d="M78 83C59 82 49 70 49 55C67 55 79 65 78 83Z" fill="#5B9C59"/>
    <path d="M77 101C58 101 47 90 45 76C62 75 75 84 77 101Z" fill="#7DB85F"/>
    <path d="M91 72C104 53 119 42 136 41C132 59 119 73 91 72Z" fill="#E2A62B"/>
    <path d="M89 91C103 71 119 61 136 61C131 79 116 91 89 91Z" fill="#F0C148"/>

    <!-- grocery basket/cart accent -->
    <path d="M95 271H286" stroke="#145A45" stroke-width="8" stroke-linecap="round"/>
    <path d="M112 247H270L249 286H131L112 247Z" fill="#145A45"/>
    <path d="M137 247L150 211H172L159 247M190 247L202 205H224L212 247" stroke="#F2C14E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="154" cy="294" r="12" fill="#145A45"/>
    <circle cx="243" cy="294" r="12" fill="#145A45"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(390,70)">
    <text x="0" y="105"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="92"
          font-weight="700"
          letter-spacing="-2"
          fill="#0F4A38">Arun Gopal</text>

    <text x="6" y="165"
          font-family="Arial, Helvetica, sans-serif"
          font-size="34"
          font-weight="700"
          letter-spacing="13"
          fill="#C98512">TRADERS</text>

    <path d="M5 192H720" stroke="#D9C79A" stroke-width="3"/>
    <circle cx="10" cy="192" r="5" fill="#145A45"/>
    <circle cx="715" cy="192" r="5" fill="#145A45"/>

    <text x="6" y="244"
          font-family="'Noto Sans Devanagari', 'Mangal', sans-serif"
          font-size="32"
          font-weight="600"
          fill="#145A45">आपकी भरोसेमंद किराना दुकान</text>

    <!-- compact promise pills -->
    <g transform="translate(4,280)">
      <rect x="0" y="0" width="210" height="48" rx="24" fill="#EFF5F0" stroke="#CFE0D5"/>
      <text x="28" y="31" font-family="'Noto Sans Devanagari','Mangal',sans-serif" font-size="20" font-weight="600" fill="#145A45">ताज़ा सामान</text>

      <rect x="228" y="0" width="190" height="48" rx="24" fill="#FFF7E7" stroke="#EBD39A"/>
      <text x="255" y="31" font-family="'Noto Sans Devanagari','Mangal',sans-serif" font-size="20" font-weight="600" fill="#9A6710">सही दाम</text>

      <rect x="436" y="0" width="298" height="48" rx="24" fill="#EFF5F0" stroke="#CFE0D5"/>
      <text x="463" y="31" font-family="'Noto Sans Devanagari','Mangal',sans-serif" font-size="20" font-weight="600" fill="#145A45">घर तक डिलीवरी • महाराजगंज</text>
    </g>
  </g>
</svg>
